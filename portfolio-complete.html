<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahima Shah — Portfolio</title>
  <style>
    /* Import Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Spectral:wght@300;400&display=swap');

    /* CSS Variables - Light Mode */
    :root {
      --bg: #f4f1ed;
      --text: #1a1a1a;
      --text-muted: #6b6b6b;
      --panel-bg: #ffffff;
      --panel-shadow: rgba(0, 0, 0, 0.06);
      --accent: #2d2d2d;
      
      /* Thematic pastel colors for panels - Light mode */
      --panel-color-1: #E3F2FD; /* Soft code blue */
      --panel-color-2: #FFE9D5; /* Soft canvas peach */
      --panel-color-3: #F3E5F5; /* Soft literary lavender */
      --panel-color-4: #E0F2F1; /* Soft film cyan */
      --panel-color-5: #FFF9E6; /* Soft travel amber */
    }

    /* CSS Variables - Dark Mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #E8E6E3;
        --text-muted: #9E9E9E;
        --panel-bg: #1E1E1E;
        --panel-shadow: rgba(0, 0, 0, 0.4);
        --accent: #E8E6E3;
        
        /* Desaturated, lighter tones for dark mode - follows Material Design 200-50 range */
        --panel-color-1: #90CAF9; /* Code - desaturated light blue (Material Blue 200) */
        --panel-color-2: #FFAB91; /* Canvas - desaturated coral/peach (Material Deep Orange 200) */
        --panel-color-3: #CE93D8; /* Words - desaturated purple (Material Purple 200) */
        --panel-color-4: #80CBC4; /* Scenes - desaturated teal (Material Teal 200) */
        --panel-color-5: #FFD54F; /* Places - desaturated amber (Material Amber 300) */
        
        /* Dark text for colored panels */
        --panel-text: #1a1a1a;
        --panel-text-muted: #424242;
      }
    }

    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body */
    body {
      font-family: 'Jost', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      height: 100vh;
    }

    /* Container */
    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 3.5rem 2rem 3rem;
    }

    /* Header Section */
    header {
      width: 100%;
      max-width: 1400px;
      padding: 0;
      margin-bottom: 3rem;
      text-align: center;
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .name {
      font-family: 'Jost', sans-serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--accent);
      margin-bottom: 0.5rem;
      line-height: 1;
    }

    .tagline {
      font-family: 'Spectral', serif;
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.01em;
      margin-top: 1rem;
      opacity: 0;
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }

    /* Gallery Section */
    .gallery-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1400px;
      margin-bottom: 2rem;
      perspective: 2000px;
      perspective-origin: center center;
      position: relative;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    .gallery-wrapper:active {
      cursor: grabbing;
    }

    .gallery {
      position: relative;
      width: 100%;
      height: 300px;
      transform-style: preserve-3d;
      transition: transform 0.08s linear;
    }

    /* Scroll Hint */
    .scroll-hint {
      width: 100%;
      max-width: 1400px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
      transition: opacity 0.3s ease;
    }
    
    .scroll-hint.hidden {
      opacity: 0;
    }

    /* Panel System - Fixed to prism faces */
    .panel {
      position: absolute;
      width: 480px;
      height: 300px;
      left: 50%;
      top: 50%;
      margin-left: -240px;
      margin-top: -150px;
      background: var(--panel-bg);
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 3rem;
      box-shadow: 
        0 2px 8px rgba(0, 0, 0, 0.04),
        0 8px 24px rgba(0, 0, 0, 0.08);
      text-decoration: none;
      color: inherit;
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
      transform-style: preserve-3d;
      transition: opacity 0.08s linear, box-shadow 0.3s ease;
    }
    
    @media (prefers-color-scheme: dark) {
      .panel {
        color: var(--panel-text, inherit);
      }
      
      .panel .panel-subtitle {
        color: var(--panel-text-muted, var(--text-muted));
      }
    }

    .panel:hover {
      box-shadow: 
        0 4px 16px rgba(0, 0, 0, 0.08),
        0 16px 48px rgba(0, 0, 0, 0.12);
    }

    .panel-label {
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1.1;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .panel:hover .panel-label {
      transform: translateY(-6px);
    }

    .panel-subtitle {
      font-family: 'Spectral', serif;
      font-size: 1rem;
      font-weight: 300;
      color: var(--text-muted);
      margin-top: 0.75rem;
      text-align: center;
      opacity: 0.7;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .panel:hover .panel-subtitle {
      opacity: 1;
      transform: translateY(0);
    }

    /* Decorative Line */
    .panel::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 50%;
      height: 1px;
      background: var(--accent);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @media (prefers-color-scheme: dark) {
      .panel::before {
        background: var(--panel-text, var(--accent));
      }
    }

    .panel:hover::before {
      transform: translateX(-50%) scaleX(1);
    }
    
    /* Individual Panel Colors */
    .panel[data-index="0"] {
      background: var(--panel-color-1);
    }
    
    .panel[data-index="1"] {
      background: var(--panel-color-2);
    }
    
    .panel[data-index="2"] {
      background: var(--panel-color-3);
    }
    
    .panel[data-index="3"] {
      background: var(--panel-color-4);
    }
    
    .panel[data-index="4"] {
      background: var(--panel-color-5);
    }

    /* Footer */
    footer {
      width: 100%;
      max-width: 1400px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
    }

    .footer-links {
      display: flex;
      gap: 2rem;
      justify-content: center;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s ease;
      position: relative;
    }

    .footer-links a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    .footer-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .gallery-wrapper {
        perspective: 1600px;
      }
      
      .gallery {
        height: 280px;
      }
      
      .panel {
        width: 440px;
        height: 280px;
        margin-left: -220px;
        margin-top: -140px;
      }
      
      .panel-label {
        font-size: 2rem;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 2rem 1.5rem;
      }
      
      .gallery-wrapper {
        perspective: 1400px;
        padding: 1.5rem 0;
      }
      
      .gallery {
        height: 260px;
      }
      
      .panel {
        width: 380px;
        height: 240px;
        margin-left: -190px;
        margin-top: -120px;
        padding: 2rem 2.5rem;
      }
      
      .panel-label {
        font-size: 1.8rem;
      }
      
      .scroll-hint {
        font-size: 0.75rem;
      }
    }

    @media (max-width: 480px) {
      .gallery-wrapper {
        perspective: 1200px;
      }
      
      .gallery {
        height: 220px;
      }
      
      .panel {
        width: 320px;
        height: 200px;
        margin-left: -160px;
        margin-top: -100px;
        padding: 1.5rem 2rem;
      }
      
      .panel-label {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="name">Mahima Shah</h1>
      <p class="tagline">always learning</p>
    </header>
    
    <div class="gallery-wrapper" id="galleryWrapper">
      <div class="gallery" id="gallery">
        <a href="#code" class="panel" data-index="0">
          <h2 class="panel-label">Code</h2>
          <p class="panel-subtitle">things I build.</p>
        </a>
        
        <a href="#canvas" class="panel" data-index="1">
          <h2 class="panel-label">Canvas</h2>
          <p class="panel-subtitle">things I make.</p>
        </a>
        
        <a href="#words" class="panel" data-index="2">
          <h2 class="panel-label">Words</h2>
          <p class="panel-subtitle">things I write.</p>
        </a>
        
        <a href="scenes.html" class="panel" data-index="3">
          <h2 class="panel-label">Scenes</h2>
          <p class="panel-subtitle">things I film.</p>
        </a>
        
        <a href="#places" class="panel" data-index="4">
          <h2 class="panel-label">Places</h2>
          <p class="panel-subtitle">places I go.</p>
        </a>
      </div>
    </div>
    
    <div class="scroll-hint" id="scrollHint">Drag to explore</div>
    
    <footer>
      <div class="footer-links">
        <a href="/cdn-cgi/l/email-protection#8fe2eee7e6e2eefce7eee7f7f6f5cfe8e2eee6e3a1ece0e2">Email</a>
        <a href="https://www.linkedin.com/in/shahmahima/" target="_blank">LinkedIn</a>
        <a href="https://www.instagram.com/mahimashahh/" target="_blank">Instagram</a>
        <a href="https://www.youtube.com/@mahimashah" target="_blank">YouTube</a>
      </div>
    </footer>
  </div>

  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
    // 3D Pentagonal Prism Gallery Implementation
    const gallery = document.getElementById('gallery');
    const galleryWrapper = document.getElementById('galleryWrapper');
    const panels = document.querySelectorAll('.panel');
    const scrollHint = document.getElementById('scrollHint');
    
    const numberOfPanels = panels.length;
    const theta = 360 / numberOfPanels;
    const radius = 650;
    
    let currentRotation = 0;
    let targetRotation = 0;
    let isDragging = false;
    let startX = 0;
    let startRotation = 0;
    let hasInteracted = false;
    
    function initializePanels() {
      panels.forEach((panel, index) => {
        const angle = index * theta;
        panel.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
      });
    }
    
    function updateGalleryRotation() {
      gallery.style.transform = `rotateY(${currentRotation}deg)`;
      
      panels.forEach((panel, index) => {
        const angle = index * theta;
        const normalizedAngle = ((currentRotation + angle) % 360 + 360) % 360;
        
        let facingAngle = normalizedAngle;
        if (facingAngle > 180) facingAngle = 360 - facingAngle;
        
        const opacity = 1 - (facingAngle / 180) * 0.6;
        panel.style.opacity = Math.max(0.4, opacity);
        
        const zIndex = Math.round(1000 - facingAngle);
        panel.style.zIndex = zIndex;
      });
    }
    
    function animate() {
      const delta = targetRotation - currentRotation;
      currentRotation += delta * 0.08;
      updateGalleryRotation();
      requestAnimationFrame(animate);
    }
    
    function handleDragStart(e) {
      isDragging = true;
      startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      startRotation = targetRotation;
      galleryWrapper.style.cursor = 'grabbing';
      
      // Hide scroll hint on first interaction
      if (!hasInteracted) {
        scrollHint.classList.add('hidden');
        hasInteracted = true;
      }
    }
    
    function handleDragMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      const currentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const deltaX = currentX - startX;
      targetRotation = startRotation + (deltaX * 0.4);
    }
    
    function handleDragEnd() {
      isDragging = false;
      galleryWrapper.style.cursor = 'grab';
    }
    
    function handleWheel(e) {
      e.preventDefault();
      targetRotation += e.deltaY * 0.15;
      
      // Hide scroll hint on wheel interaction
      if (!hasInteracted) {
        scrollHint.classList.add('hidden');
        hasInteracted = true;
      }
    }
    
    galleryWrapper.addEventListener('mousedown', handleDragStart);
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);
    
    galleryWrapper.addEventListener('touchstart', handleDragStart, { passive: false });
    galleryWrapper.addEventListener('touchmove', handleDragMove, { passive: false });
    window.addEventListener('touchend', handleDragEnd);
    
    galleryWrapper.addEventListener('wheel', handleWheel, { passive: false });
    
    initializePanels();
    animate();
    
    setTimeout(() => {
      targetRotation = 20;
    }, 600);
  </script>
</body>
</html>
